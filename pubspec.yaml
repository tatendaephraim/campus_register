name: campus_register
description: A Flutter app for campus attendance with location and biometrics.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM-like)
  flutter_riverpod: ^2.5.1  # For providers/ViewModels

  # Location
  geolocator: ^12.0.0

  # Biometrics
  local_auth: ^2.2.0

  # HTTP for Google Sheets
  http: ^1.2.1

  # File path and storage
  path_provider: ^2.1.3

  # Material icons (built-in, but explicit)
  cupertino_icons: ^1.0.8  # For iOS style if needed

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true