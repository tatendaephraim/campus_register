name: campus_register
description: A Flutter app for campus attendance with location and biometrics.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM-like)
  flutter_riverpod: ^2.5.1  # For providers/ViewModels

  # Location
  geolocator: ^14.1.2

  # Maps
  google_maps_flutter: ^2.5.0

  # Database
  sqflite: ^2.3.2
  
  # Barometer for altitude calculation

  # Biometrics
  local_auth: ^3.0.2

  # HTTP for Google Sheets
  http: ^1.2.1

  # Date formatting
  intl: ^0.20.2

  # File path and storage
  path_provider: ^2.1.3

  # Material icons (built-in, but explicit)
  cupertino_icons: ^1.0.8  # For iOS style if needed

  # To get a unique device identifier for student registration
  device_info_plus: ^13.3.0

  # For Google API access (Drive, Apps Script)
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  google_fonts: ^6.2.1

  # For creating CSV files
  csv: ^6.0.0

  # For sharing files
  share_plus: ^13.3.1
  google_sign_in: ^6.2.1
  sensors_plus: ^7.0.0
  supabase_flutter: ^2.14.2
  lottie: ^3.1.2
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.10+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/