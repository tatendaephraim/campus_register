name: campus_register
description: >-
  Proof of concept for presence-assured campus attendance: an
  uncertainty-aware geofence, on-device biometrics and a tamper-evident,
  offline-first log.

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0 # State management
  geolocator: ^14.1.2 # GNSS position, accuracy and mock-location flag
  local_auth: ^3.0.2 # Platform biometric prompt
  http: ^1.6.0 # Synchronisation
  crypto: ^3.0.8 # SHA-256 for the hash chain
  path_provider: ^2.1.6 # Private application storage
  share_plus: ^13.3.1 # CSV export for evaluation
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
