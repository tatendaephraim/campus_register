<svg viewBox="40 30 180 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="60%" stop-color="#2563c4"/>
      <stop offset="100%" stop-color="#1440a0"/>
    </linearGradient>
    <linearGradient id="shieldLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d2660"/>
      <stop offset="100%" stop-color="#1a3a8a"/>
    </linearGradient>
    <linearGradient id="shieldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ab4ff"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
    <linearGradient id="capBrim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe599"/>
      <stop offset="100%" stop-color="#d4a200"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe599"/>
      <stop offset="100%" stop-color="#d4a200"/>
    </linearGradient>
    <linearGradient id="lockBody" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#a8c0f0"/>
    </linearGradient>
    <linearGradient id="glowRing" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#7ab4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="40" y="30" width="180" height="180" rx="36"/>
    </clipPath>
  </defs>

  <rect x="40" y="30" width="180" height="180" rx="36" fill="url(#iconBg)" filter="url(#softShadow)"/>

  <g clip-path="url(#iconClip)" opacity="0.13">
    <g fill="#4f8ef7">
      <circle cx="60" cy="60" r="1.5"/><circle cx="90" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="150" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="210" cy="60" r="1.5"/>
      <circle cx="60" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="120" cy="90" r="1.5"/><circle cx="150" cy="90" r="1.5"/><circle cx="180" cy="90" r="1.5"/><circle cx="210" cy="90" r="1.5"/>
      <circle cx="60" cy="120" r="1.5"/><circle cx="90" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="150" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/><circle cx="210" cy="120" r="1.5"/>
      <circle cx="60" cy="150" r="1.5"/><circle cx="90" cy="150" r="1.5"/><circle cx="120" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="180" cy="150" r="1.5"/><circle cx="210" cy="150" r="1.5"/>
      <circle cx="60" cy="180" r="1.5"/><circle cx="90" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="150" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="210" cy="180" r="1.5"/>
    </g>
  </g>

  <ellipse cx="130" cy="130" rx="65" ry="65" fill="url(#glowRing)" clip-path="url(#iconClip)"/>

  <polygon points="75,85 100,68 100,155 75,172" fill="url(#shieldLeft)" opacity="0.9"/>
  <polygon points="75,85 130,68 185,85 130,58" fill="url(#shieldTop)"/>
  <path d="M100,68 L160,68 L185,85 L185,145 Q185,165 130,185 Q75,165 75,145 L75,85 Z" fill="url(#shieldFace)"/>
  <path d="M108,78 L152,78 L172,92 L172,140 Q172,156 130,172 Q88,156 88,140 L88,92 Z" fill="none" stroke="#7ab4ff" stroke-width="1" opacity="0.35"/>

  <rect x="118" y="118" width="24" height="20" rx="4" fill="url(#lockBody)" filter="url(#glow)"/>
  <rect x="122" y="108" width="4" height="14" rx="2" fill="#c8dcf8" opacity="0.8"/>
  <rect x="134" y="108" width="4" height="14" rx="2" fill="#a0bce8" opacity="0.8"/>
  <path d="M122,110 Q122,100 130,100 Q138,100 138,110" fill="none" stroke="#d8ecff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="142" y="120" width="5" height="16" rx="2" fill="#0d2660" opacity="0.7"/>
  <circle cx="130" cy="126" r="3.5" fill="#0d2660"/>
  <rect x="129" y="126" width="2" height="5" rx="1" fill="#0d2660"/>

  <polygon points="108,73 130,64 152,73 130,82" fill="url(#capBrim)"/>
  <polygon points="108,73 108,76 130,85 130,82" fill="#9a7000" opacity="0.7"/>
  <polygon points="114,73 130,66 146,73 130,80" fill="url(#capTop)"/>
  <polygon points="114,73 114,77 130,84 130,80" fill="#b08000" opacity="0.8"/>
  <ellipse cx="130" cy="72" rx="6" ry="3" fill="#ffe599"/>
  <ellipse cx="130" cy="69" rx="3" ry="1.5" fill="#ffd250"/>
  <line x1="152" y1="73" x2="158" y2="78" stroke="#ffd966" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="158" y1="78" x2="158" y2="88" stroke="#ffd966" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="158" cy="90" r="2.5" fill="#ffd250"/>
</svg>
